# Configuration (modify as needed)
# This is the user-owned source for the AndroidTProxyShell configuration. The
# module creates a disposable copy at runtime and never modifies this file.

# Proxy core configuration
# Proxy running user and group
CORE_USER_GROUP="root:net_admin"
# Proxy traffic mark
ROUTING_MARK=""
FORCE_MARK_BYPASS=0

# Proxy ports (transparent proxy listening ports). The module uses the TCP
# port for its sing-box inbound; tproxy mode requires both ports to match.
PROXY_TCP_PORT=1536
PROXY_UDP_PORT=1536

# Proxy mode: 0=auto (check TPROXY support), 1=force TPROXY, 2=force REDIRECT.
# The runtime copy overrides this with the module's proxy_mode.
PROXY_MODE=0
# Performance mode (0=normal, 1=performance optimized)
# When enabled, may enable some features (e.g. conntrack) for better speed.
PERFORMANCE_MODE=0

# DNS configuration
# DNS hijack method (0: disabled, 1: tproxy, 2: redirect). A non-zero value
# is aligned with the module proxy mode in the runtime copy.
DNS_HIJACK_ENABLE=1
# DNS listening port
DNS_PORT=1053

# Interface definitions
# Mobile data interface
MOBILE_INTERFACE="rmnet_data+"
# WiFi interface
WIFI_INTERFACE="wlan0"
# Hotspot interface
HOTSPOT_INTERFACE="wlan2"
# USB tethering interface
USB_INTERFACE="rndis+"
# Other interfaces that require bypassing or proxying. Multiple interfaces can
# be separated by spaces.
OTHER_BYPASS_INTERFACES=""
OTHER_PROXY_INTERFACES=""

# Proxy switches
PROXY_MOBILE=1
PROXY_WIFI=1
PROXY_HOTSPOT=0
PROXY_USB=0
PROXY_TCP=1
PROXY_UDP=1

# IPv6 proxy control:
#  0 = disable proxy (but IPv6 stack remains active)
#  1 = enable proxy (normal IPv6 proxy)
# -1 = force disable IPv6 stack entirely (disable_ipv6=1 on all interfaces)
PROXY_IPV6=0

# Additional bypass and forced-proxy networks. AndroidTProxyShell manages its
# own default private and local ranges.
BYPASS_IPv4_LIST=""
BYPASS_IPv6_LIST=""
PROXY_IPv4_LIST=""
PROXY_IPv6_LIST=""

# Hotspot subnet when WiFi and hotspot share the same interface (common on
# older devices). Only used when HOTSPOT_INTERFACE == WIFI_INTERFACE.
HOTSPOT_SUBNET_IPV4="192.168.43.0/24"
HOTSPOT_SUBNET_IPV6="fe80::/10"

# Mark values. Avoid conflicts when multiple transparent proxies coexist.
MARK_VALUE=20
MARK_VALUE6=25
# Routing table ID
TABLE_ID=2025

# Per-app proxy (use space to separate package names, supports user:package format)
APP_PROXY_ENABLE=0
PROXY_APPS_LIST=""
# Example: "com.example.app com.other"
BYPASS_APPS_LIST=""
# Example: "com.android.shell"
APP_PROXY_MODE="blacklist"
# "blacklist" or "whitelist"
# In blacklist mode, all apps proxy except BYPASS_APPS_LIST; module-generated
# bypass apps are deduplicated and appended only to the runtime copy.
# In whitelist mode, only PROXY_APPS_LIST proxies. BYPASS_APPS_LIST and the
# module-generated bypass list are intentionally ignored.

# CN IP bypass configuration
BYPASS_CN_IP=0
# CN IP list file name
CN_IP_FILE="cn.zone"
CN_IPV6_FILE="cn_ipv6.zone"
# CN IP source URLs
CN_IP_URL="https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/CN-ip-cidr.txt"
CN_IPV6_URL="https://ispip.clang.cn/all_cn_ipv6.txt"

# MAC address blacklist/whitelist configuration (hotspot mode)
MAC_FILTER_ENABLE=0
# MAC address blacklist/whitelist (use space to separate MAC addresses)
PROXY_MACS_LIST=""
# Example: "AA:BB:CC:DD:EE:FF 11:22:33:44:55:66"
BYPASS_MACS_LIST=""
# Example: "FF:EE:DD:CC:BB:AA"
MAC_PROXY_MODE="blacklist"
# "blacklist" or "whitelist"

# Block QUIC traffic
BLOCK_QUIC=0

# Dry-run mode (disabled by default)
DRY_RUN=0
